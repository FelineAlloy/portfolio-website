{{ define "main" }}
<div class="shell page page--awards">
  <header class="page__head">
    <a class="page__back" href="{{ site.Home.RelPermalink }}">{{ partial "icon.html" "arrow-left" }}Home</a>
    <h1 class="page__title">{{ .Title }}</h1>
    {{- with .Content }}<div class="page__lede">{{ . }}</div>{{ end }}
  </header>
  <ol class="awards">
    {{- range .Pages }}
    <li>{{ partial "awards/award.html" . }}</li>
    {{- end }}
  </ol>
</div>
{{ end }}
