{{- /* Inline SVG icons, 1em, drawn in the current text color. Context: the icon name. */ -}}
{{- $paths := dict
  "arrow-left"     `<path d="M13 8H3M7.5 3.5 3 8l4.5 4.5"/>`
  "arrow-right"    `<path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/>`
  "arrow-up-right" `<path d="M5 11 11 5M6 5h5v5"/>`
-}}
{{- with index $paths . -}}
<svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{{ . | safeHTML }}</svg>
{{- else -}}
  {{- errorf "icon.html: unknown icon %q" . -}}
{{- end -}}
