{{- /* One role on the experience page: dates on the left, role, organisation and details on the right. Context: a role page. */ -}}
<article class="role" id="{{ .File.ContentBaseName }}">
  <p class="role__period meta">{{ .Params.period | default .Date.Year }}</p>
  <div class="role__body">
    <h2 class="role__org">{{ .Params.org | default .Title }}</h2>
    {{- if .Params.org }}<p class="role__position">{{ .Title }}</p>{{ end }}
    <div class="role__details prose">
      {{- .Content }}
    </div>
  </div>
</article>
