# Root-relative for local preview. The deploy workflow overrides this with the real Pages URL.
baseURL = "/"
title = "Luxin Matasaru"

# Only the home page and project pages are generated.
disableKinds = ["section", "taxonomy", "term", "rss", "sitemap"]

# Plain <pre><code> blocks: no per-token inline styles, keeps pages small.
[markup.highlight]
  codeFences = false

[params]
  description = "Portfolio of Luxin Matasaru: Mathematics & Computer Science student at École Polytechnique working on reinforcement learning and embedded systems."

  # Footer links. Add e.g. Email / CV / Google Scholar entries here.
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/FelineAlloy"

# Header navigation: anchors on the home page, matching the `##` headings in content/_index.md.
[[menus.main]]
  name = "Research"
  url = "#research"
  weight = 1

[[menus.main]]
  name = "Projects"
  url = "#projects"
  weight = 2

[[menus.main]]
  name = "Field Notes"
  url = "#field-notes"
  weight = 3

[[menus.main]]
  name = "Contact"
  url = "#contact"
  weight = 4
