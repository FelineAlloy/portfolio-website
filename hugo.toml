# Root-relative for local preview. The deploy workflow overrides this with the real Pages URL.
baseURL = "/"
title = "Luxin Matasaru"
locale = "en"

# Generated: the home page, project pages and the experience page.
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

# Plain <pre><code> blocks: no per-token inline styles, keeps pages small.
[markup.highlight]
  codeFences = false

# Lets the image render hook turn an image on its own line into a <figure>.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[params]
  description = "Luxin Matasaru: Mathematics & Computer Science student at École Polytechnique working on reinforcement learning, embedded systems and space engineering."

  # The first address is shown in the intro; all are listed under Contact.
  [[params.emails]]
    address = "luxin.matasaru@polytechnique.edu"
    label = "École Polytechnique"
  [[params.emails]]
    address = "lmatasaru@eth.ch"
    label = "ETH Zürich"

  # Shown as buttons in the intro and the footer, in this order.
  # `url` may be absolute or a path under static/ (leading slash).
  [[params.links]]
    name = "CV"
    url = "/Resume_Luxin_Matasaru.pdf"
    primary = true
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/FelineAlloy"
  [[params.links]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/luxin-gabriel-matasaru-903861269"

# Header navigation. "#id" links point at sections of the home page.
# Links are given as params.href because Hugo lowercases menu URLs.
[[menus.main]]
  name = "Work"
  params = { href = "#work" }
  weight = 1
[[menus.main]]
  name = "Experience"
  params = { href = "/experience/" }
  weight = 2
[[menus.main]]
  name = "CV"
  params = { href = "/Resume_Luxin_Matasaru.pdf" }
  weight = 3
[[menus.main]]
  name = "Contact"
  params = { href = "#contact" }
  weight = 4
